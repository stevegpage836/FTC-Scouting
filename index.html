<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0b1f3a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
  <title>FTC Scouting App</title>
</head>
<body>
  <header class="topbar">
    <div class="title">FTC Scout</div>
    <div class="status">
      <span id="online-dot" class="online">&#x25CF;</span>
      <span id="pending-badge" class="badge">0 pending sync</span>
    </div>
  </header>

  <main>
    <!-- The form fields are generated by app.js from MATCH_FIELDS in config.js -->
    <div id="scout-form"></div>

    <div class="actions">
      <button id="save-btn" class="btn btn-primary">Save match (offline)</button>
      <button id="sync-btn" class="btn btn-secondary">Sync now</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- idb: tiny IndexedDB helper. Cached by the service worker for offline use. -->
  <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
  <!-- Load order matters: config -> db -> sync -> app -->
  <script src="./config.js"></script>
  <script src="./db.js"></script>
  <script src="./sync.js"></script>
  <script src="./app.js"></script>
</body>
</html>
